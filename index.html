<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cartao">
    <header>
      <h1>Lista de tarefas</h1>
      <p class="descricao">Cadastre uma tarefa e clique nela para riscar.</p>
    </header>

    <form id="formulario" novalidate>
      <label for="tarefa">Nome da tarefa</label>
      <div class="linha">
        <input type="text" id="tarefa" name="tarefa" placeholder="Ex.: Estudar jQuery" autocomplete="off">
        <button type="submit">Cadastrar</button>
      </div>
    </form>

    <ul id="lista" class="lista"></ul>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
